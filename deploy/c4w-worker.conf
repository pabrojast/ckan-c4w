
[program:c4w-worker]
command=/usr/local/bin/ckan -c /srv/app/production.ini c4w worker
user=ckan
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=600
redirect_stderr=true
stdout_logfile=/var/log/ckan/c4w-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
